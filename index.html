<!doctype html>
<html lang="fr">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, viewport-fit=cover" />
        <meta name="theme-color" content="#e8590c" />
        <title>Ma ToDo</title>

        <link rel="stylesheet" href="lib/framework7-bundle.min.css" />
        <link rel="stylesheet" href="lib/framework7-icons/css/framework7-icons.css" />
        <link rel="stylesheet" href="css/app.css" />

        <style>
    .navbar-bg {
        background-color: #e8590c !important;
    }
    .navbar .title {
        color: #ffffff !important;
    }
    .tache-faite {
        text-decoration: line-through !important;
        color: #a1a1a1 !important;
    }
    /* Style ajusté pour l'icône poubelle */
    .btn-suppr {
        color: #ff3b30 !important;
        cursor: pointer;
        display: flex;
        align-items: center;
    }
</style>
    </head>
    <body>
        
        <div id="app">
            <div class="view view-main safe-areas">
                <div class="page" data-name="home">
                    
                    <div class="navbar">
                        <div class="navbar-bg"></div>
                        <div class="navbar-inner">
                            <div class="title">Ma ToDo</div>
                        </div>
                    </div>

                    <div class="page-content">
                        
                        <div class="list inset">
                            <ul>
                                <li class="item-content item-input">
                                    <div class="item-inner">
                                        <div class="item-input-wrap">
                                            <input type="text" id="champ-tache" placeholder="Nouvelle tâche...">
                                        </div>
                                    </div>
                                </li>
                            </ul>
                        </div>

                        <div class="block">
                            <button class="button button-fill" id="btn-ajouter" style="width: 100%;">Ajouter</button>
                        </div>

                        <div class="list simple-list">
                            <ul id="liste-taches-ul">
                                </ul>
                        </div> 
                        
                        <div class="block">
                            <p class="text-color-gray">
                                À compléter pendant les séances.
                            </p>
                        </div>

                    </div> 
                </div>
            </div>
        </div>

        <script src="lib/framework7-bundle.min.js"></script>
        <script src="js/app.js"></script>
    </body>
</html>
